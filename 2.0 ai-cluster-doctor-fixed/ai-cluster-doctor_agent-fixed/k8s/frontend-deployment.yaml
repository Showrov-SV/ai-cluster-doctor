# Frontend Deployment - stateless static build served by nginx (see
# frontend/Dockerfile's prod target), so it's safe to run multiple
# replicas, unlike the Host.
#
# Reminder (same caveat as in docker-compose.yml): the image was built
# with VITE_API_BASE baked in at build time. It must match wherever this
# Ingress's public hostname ends up (see ingress.yaml) - rebuild the image
# if that hostname changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: ai-cluster-doctor
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-cluster-doctor
      component: frontend
  template:
    metadata:
      labels:
        app: ai-cluster-doctor
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ai-cluster-doctor-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
