# Host secrets (JWT signing key, agent API key, initial admin account,
# optional LLM API key).
#
# DO NOT commit this file with real values filled in. The placeholders
# below are for structure/reference only. In a real deployment, generate
# it directly instead, e.g.:
#
#   kubectl create secret generic host-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=CLUSTER_DOCTOR_AGENT_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_USERNAME=admin \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=ANTHROPIC_API_KEY=""
#
# ...or manage it via your cluster's secret manager (Sealed Secrets,
# External Secrets Operator, Vault, etc.) instead of a plain manifest at
# all. If you do apply this file as-is, JWT_SECRET/agent-api-key/admin
# password will just fall back to auth.py's own auto-generation (see
# _get_or_create_secret) since empty env values are treated as unset.
apiVersion: v1
kind: Secret
metadata:
  name: host-secrets
type: Opaque
stringData:
  JWT_SECRET: ""
  CLUSTER_DOCTOR_AGENT_API_KEY: ""
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: ""
  ANTHROPIC_API_KEY: ""
